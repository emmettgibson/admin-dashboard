<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <div class="container">
    <div class="sidebar">
      <h1>** Dashboard</h1>
    <ul>
      <li>* Home</li>
      <li>* Profile</li>
      <li>* Messages</li>
      <li>* History</li>
      <li>* Tasks</li>
      <li>* Communities</li>
    </ul>
    <ul>
      <li>* Settings</li>
      <li>* Support</li>
      <li>* Privacy</li>
    </ul>
    </div>
    <div class="header">
      <div class="top-left">
      <div>++</div>
      <input type="text">
      </div>
  
      <div class="top-right">
          <div>+</div>
          <div class="image"><img src="panda.jpg" alt=""></div>
          <div>Emmett</div>
      </div>
  
      <div class="bottom-left">
        <div><img src="panda.jpg" alt=""></div>
        <div>
        <div>Hi there,</div>
        <div class="name">Emmett (@emmlgi)</div>
      </div>
      </div>
      <div class="bottom-right">
        <button>New</button>
        <button>Upload</button>
        <button>Share</button>
      </div>
    </div>

  <div class="main-content">
    <div class="left">
      <p>Your Projects</p>
      <div class="left-container">
      <div class="box one"></div>
      <div class="box two"></div>
      <div class="box three"></div>
      <div class="box four"></div>
      <div class="box five"></div>
      <div class="box six"></div>
    </div>
    </div>
    <div class="right">
      <div class="upper">
        <p>Announcements</p>
      <div class="box">
      </div>
      </div>
      <div class="lower">
        <p>Trending</p>
      <div class="box">
      </div>
      </div>
    </div>
  </div>

  </div>
  

</body>
</html>
